<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>DIC 设置</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#fff;--fg:#17284a;--muted:#5b6b8a;--accent:#2f6fed;--tint:#eef3fd;--line:#d8e2f4}
@media(prefers-color-scheme:dark){:root{--bg:#141c2e;--fg:#e6edfb;--muted:#9db0d3;--accent:#7ba6ff;--tint:#1c2740;--line:#2a3752}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}
main{max-width:560px;margin:48px auto;padding:0 20px}
h1{font-size:22px;font-weight:650;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 28px}
section{padding:18px 0;border-top:1px solid var(--line)}label{display:block;font-weight:600;margin-bottom:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hint{color:var(--muted);font-size:13px;margin-top:6px}
select,input{font:inherit;color:inherit;background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer}
#status{padding:10px 12px;border-radius:8px;background:var(--tint);white-space:pre-wrap;font-size:14px}
code{background:var(--tint);padding:1px 5px;border-radius:4px}
</style></head><body><main>
<h1>DIC</h1><p class="sub">上下文智能词典 · 本地网关 + Gemini</p>
<section><label>服务状态</label><div id="status">检查中…</div>
<div class="row" style="margin-top:8px"><button id="check">测试连接</button><span class="hint">未启动时在仓库目录运行：<code>node --env-file-if-exists=.env.local server/server.mjs</code></span></div></section>
<section><label>唤醒方式</label>
<select id="trigger"><option value="hover">鼠标停在词上（默认）</option><option value="alt">按住 Option/Alt 再停留</option><option value="select">只在选中文字时</option></select>
<div class="row" style="margin-top:8px"><span>停留时间</span><input id="dwell" type="number" min="200" max="2000" step="50" style="width:90px"> ms</div>
<p class="hint">悬停只对英文单词、缩写、专名生效；中文术语请用鼠标选中。</p></section>
<section><label>解释语言</label><select id="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></section>
<section><label>阅读页</label><div class="row"><a id="reader" href="reader.html" target="_blank">打开 DIC 阅读页</a><span class="hint">粘贴文本或打开 .txt / .md，用同样方式查词。</span></div></section>
<p class="hint">API Key 只保存在电脑上的 <code>.env.local</code>，浏览器里没有它。</p>
</main><script src="options.js"></script></body></html>
